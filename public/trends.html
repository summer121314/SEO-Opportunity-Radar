<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Google Trends 热词机会 | SEO Opportunity Radar</title><meta name="description" content="每天自动整理日本与美国的 Google Trends 近期热词，筛选可能衍生实用工具网站的需求。"><link rel="canonical" href="https://seo-opportunity-radar.vercel.app/trends.html"><link rel="alternate" hreflang="zh-CN" href="https://seo-opportunity-radar.vercel.app/trends.html"><link rel="alternate" hreflang="en" href="https://seo-opportunity-radar.vercel.app/en/trends.html"><link rel="alternate" hreflang="ja" href="https://seo-opportunity-radar.vercel.app/ja/trends.html"><style>:root{font:16px/1.6 system-ui,sans-serif;color:#eff6ff;background:#0c1423}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1130px;margin:auto;padding:25px}a{color:#8ce1c9;text-decoration:none}nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}nav .langs{display:flex;gap:12px}h1{font-size:clamp(32px,5vw,55px);line-height:1.1;margin:32px 0 12px}.sub{color:#a8bdd2}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0;padding:18px;background:#172439;border:1px solid #304663;border-radius:14px}.toolbar>*{font:inherit;border:1px solid #3e5b70;background:#0e1b2a;color:#f4fcff;border-radius:8px;padding:11px;flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}.card{padding:19px;border:1px solid #314962;background:#162337;border-radius:14px}.card h2{font-size:20px;line-height:1.35;overflow-wrap:anywhere}.pill{font-size:12px;background:#244b4b;color:#a3f3db;border-radius:22px;padding:5px 9px}.small{font-size:13px;color:#adc0d2}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.note{padding:18px;border:1px solid #395776;border-radius:12px;margin:30px 0;color:#c0cfe3}@media(max-width:600px){.wrap{padding:16px}}</style></head><body><nav class="wrap"><a href="/">◈ SEO OPPORTUNITY RADAR</a><div class="langs"><a href="/trends.html">中文</a><a href="/en/trends.html">English</a><a href="/ja/trends.html">日本語</a></div></nav><main class="wrap"><a href="/">← 返回机会雷达</a><h1>Google Trends 热词机会</h1><p class="sub">先看热度，再验证长期需求。不是每个热门搜索都适合建站。</p><div class="toolbar"><input id="search" placeholder="搜索热词、类别" aria-label="搜索热词、类别"><select id="geo"><option value="">日本 + 美国</option><option value="JP">🇯🇵 Japan</option><option value="US">🇺🇸 USA</option></select><select id="potential"><option value="">所有词</option><option value="true">可能衍生实用网站</option></select></div><p class="small" id="status">最近更新: —</p><div class="grid" id="items"><p>当前还没有趋势数据，请先在 GitHub Actions 手动运行更新任务。</p></div><div class="note">数据来源：Google Trends Trending Now RSS。搜索量为 Google 提供的近似档位，不能当作月搜索量；RSS 不提供百分比增长。筛选出的建站机会只是规则提示，仍需核实需求持续性、竞争和可开发性。 <a href="https://trends.google.com/trending" target="_blank" rel="noopener noreferrer">Google Trends ↗</a></div></main><script>const CAT={"实用工具":"实用工具","科技工具":"科技工具","教育学习":"教育学习","旅行生活":"旅行生活","待人工判断":"待人工判断"},SUG={"实用工具":"调查是否需要计算器、转换器、表单或查询工具","科技工具":"调查教程、功能对比或效率工具需求","教育学习":"调查练习题、模拟测试、学习计划需求","旅行生活":"调查路线、费用、行程或指南需求","待人工判断":"先确认实际搜索意图和长期需求"},TEXT={"title":"Google Trends 热词机会","desc":"每天自动整理日本与美国的 Google Trends 近期热词，筛选可能衍生实用工具网站的需求。","lead":"先看热度，再验证长期需求。不是每个热门搜索都适合建站。","all":"所有词","potential":"可能衍生实用网站","country":"国家","allCountries":"日本 + 美国","filter":"筛选","updated":"最近更新","count":"候选热词","search":"搜索热词、类别","traffic":"近期大致搜索量","verify":"在 Google Trends 验证 ↗","source":"查看原始趋势 ↗","none":"当前还没有趋势数据，请先在 GitHub Actions 手动运行更新任务。","review":"待验证","notes":"数据来源：Google Trends Trending Now RSS。搜索量为 Google 提供的近似档位，不能当作月搜索量；RSS 不提供百分比增长。筛选出的建站机会只是规则提示，仍需核实需求持续性、竞争和可开发性。","home":"← 返回机会雷达","suggest":"可能的产品方向"};let all=[];const e=x=>document.getElementById(x);const safeUrl=x=>{try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};function render(){const q=e('search').value.toLocaleLowerCase(),geo=e('geo').value,p=e('potential').value;const list=all.filter(x=>(!geo||x.geo===geo)&&(!p||String(x.potential)===p)&&(!q||[x.query,x.category].join(' ').toLocaleLowerCase().includes(q)));e('items').replaceChildren();if(!list.length){let n=document.createElement('p');n.textContent=TEXT.none;e('items').append(n);return}for(const x of list){const card=document.createElement('article');card.className='card';const badge=document.createElement('span');badge.className='pill';badge.textContent=(x.geo==='JP'?'🇯🇵 ':'🇺🇸 ')+(CAT[x.category]||x.category);const heading=document.createElement('h2');heading.textContent=x.query;const meta=document.createElement('p');meta.className='small';meta.textContent=TEXT.traffic+': '+(x.approxTraffic||'—')+' · '+TEXT.review;const hint=document.createElement('p');hint.className='small';hint.textContent=TEXT.suggest+': '+(SUG[x.category]||SUG['待人工判断']);const action=document.createElement('div');action.className='actions';for(const [label,url] of [[TEXT.verify,x.exploreUrl],[TEXT.source,x.sourceUrl]]){const href=safeUrl(url);if(href){const a=document.createElement('a');a.href=href;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';action.append(a)}}card.append(badge,heading,meta,hint,action);e('items').append(card)}}for(const id of ['search','geo','potential'])e(id).addEventListener('input',render);fetch('/trends.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(String(r.status));return r.json()}).then(d=>{all=Array.isArray(d.items)?d.items:[];e('status').textContent=TEXT.updated+': '+(d.updatedAt?new Date(d.updatedAt).toLocaleString('zh-CN'):'—')+' · '+TEXT.count+': '+all.length;render()}).catch(()=>{e('items').textContent=TEXT.none});</script></body></html>
