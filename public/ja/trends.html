<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Google Trends 急上昇キーワード | SEO Opportunity Radar</title><meta name="description" content="日本と米国のGoogle Trendsを毎日収集し、実用的なWebサイト需要を調べるためのヒントを整理します。"><link rel="canonical" href="https://seo-opportunity-radar.vercel.app/ja/trends.html"><link rel="alternate" hreflang="zh-CN" href="https://seo-opportunity-radar.vercel.app/trends.html"><link rel="alternate" hreflang="en" href="https://seo-opportunity-radar.vercel.app/en/trends.html"><link rel="alternate" hreflang="ja" href="https://seo-opportunity-radar.vercel.app/ja/trends.html"><style>:root{font:16px/1.6 system-ui,sans-serif;color:#eff6ff;background:#0c1423}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1130px;margin:auto;padding:25px}a{color:#8ce1c9;text-decoration:none}nav{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}nav .langs{display:flex;gap:12px}h1{font-size:clamp(32px,5vw,55px);line-height:1.1;margin:32px 0 12px}.sub{color:#a8bdd2}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0;padding:18px;background:#172439;border:1px solid #304663;border-radius:14px}.toolbar>*{font:inherit;border:1px solid #3e5b70;background:#0e1b2a;color:#f4fcff;border-radius:8px;padding:11px;flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:14px}.card{padding:19px;border:1px solid #314962;background:#162337;border-radius:14px}.card h2{font-size:20px;line-height:1.35;overflow-wrap:anywhere}.pill{font-size:12px;background:#244b4b;color:#a3f3db;border-radius:22px;padding:5px 9px}.small{font-size:13px;color:#adc0d2}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}.note{padding:18px;border:1px solid #395776;border-radius:12px;margin:30px 0;color:#c0cfe3}@media(max-width:600px){.wrap{padding:16px}}</style><script defer src="/_vercel/insights/script.js"></script></head><body><nav class="wrap"><a href="/ja/">◈ SEO OPPORTUNITY RADAR</a><div class="langs"><a href="/trends.html">中文</a><a href="/en/trends.html">English</a><a href="/ja/trends.html">日本語</a></div></nav><main class="wrap"><a href="/ja/">← 機会レーダーへ戻る</a><h1>Google Trends 急上昇キーワード</h1><p class="sub">急上昇の後に、継続的な需要と競合を検証しましょう。</p><div class="toolbar"><input id="search" placeholder="キーワード・分野を検索" aria-label="キーワード・分野を検索"><select id="geo"><option value="">日本＋米国</option><option value="JP">🇯🇵 Japan</option><option value="US">🇺🇸 USA</option></select><select id="potential"><option value="">すべて</option><option value="true">実用サイトの候補</option></select><select id="rank"><option value="">優先度：すべて</option><option value="high">優先調査</option><option value="medium">調査候補</option><option value="low">優先度低</option></select></div><p class="small" id="status">最終更新: —</p><div class="grid" id="items"><p>まだデータがありません。GitHub Actionsを手動実行してください。</p></div><div class="note">出典：Google Trends Trending Now RSS。検索数は概算の区分で、月間検索数ではありません。RSSに上昇率はありません。サイト企画の候補はルールに基づくヒントであり、需要が確定したものではありません。 <a href="https://trends.google.com/trending" target="_blank" rel="noopener noreferrer">Google Trends ↗</a></div></main><script>const CAT={"实用工具":"実用ツール","科技工具":"技術ツール","教育学习":"学習・教育","旅行生活":"旅行・生活","待人工判断":"要確認"},SUG={"实用工具":"計算・変換・フォーム・検索ツールの需要を検討","科技工具":"解説・比較・効率化ツールを検討","教育学习":"問題演習・模擬試験・学習計画を検討","旅行生活":"旅程・費用・ルート・ガイドを検討","待人工判断":"検索意図と長期需要を先に確認"},TEXT={"title":"Google Trends 急上昇キーワード","desc":"日本と米国のGoogle Trendsを毎日収集し、実用的なWebサイト需要を調べるためのヒントを整理します。","lead":"急上昇の後に、継続的な需要と競合を検証しましょう。","all":"すべて","potential":"実用サイトの候補","country":"国・地域","allCountries":"日本＋米国","filter":"表示","updated":"最終更新","count":"急上昇ワード","search":"キーワード・分野を検索","traffic":"直近の概算検索数","verify":"Google Trendsで検証 ↗","source":"元のトレンドを見る ↗","none":"まだデータがありません。GitHub Actionsを手動実行してください。","review":"要検証","notes":"出典：Google Trends Trending Now RSS。検索数は概算の区分で、月間検索数ではありません。RSSに上昇率はありません。サイト企画の候補はルールに基づくヒントであり、需要が確定したものではありません。","home":"← 機会レーダーへ戻る","suggest":"考えられるサイトの方向性"};let all=[];const e=x=>document.getElementById(x);const safeUrl=x=>{try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};const LABELS=["優先度","優先調査","調査候補","優先度低","企画スコア","SEO難易度・実測検索流入ではありません","ニュース・芸能を除外"];const classify=x=>{const q=x.query||'';const no=/\b(celebrity|actor|actress|died|death|murder|football|baseball|basketball|nba|nfl|mlb|stock|shares|earnings|election|president|movie|earthquake|war|lottery)\b|芸能|野球|サッカー|株価|選挙|地震|事件|訃報/i;const strong=/\b(converter|calculator|generator|template|planner|checker|validator|formatter|translator|invoice|tax calculator|resume builder|csv|pdf)\b|変換|計算|テンプレート|税金計算|履歴書/i;const medium=/\b(how to|guide|tutorial|compare|cost|price|schedule|map|visa|learning|study|automation|workflow|budget|travel)\b|使い方|比較|方法|料金|勉強|学習|補助金|予約|観光/i;const score=no.test(q)?5:strong.test(q)?85:medium.test(q)?65:x.category!=='待人工判断'?45:20;return {score,rank:score>=75?'high':score>=55?'medium':'low'}};function render(){const q=e('search').value.toLocaleLowerCase(),geo=e('geo').value,p=e('potential').value,rank=e('rank').value;const list=all.filter(x=>(!geo||x.geo===geo)&&(!p||String(classify(x).score>=55)===p)&&(!rank||classify(x).rank===rank)&&(!q||[x.query,x.category].join(' ').toLocaleLowerCase().includes(q)));e('items').replaceChildren();if(!list.length){let n=document.createElement('p');n.textContent=TEXT.none;e('items').append(n);return}for(const x of list){const card=document.createElement('article');card.className='card';const badge=document.createElement('span');badge.className='pill';badge.textContent=(x.geo==='JP'?'🇯🇵 ':'🇺🇸 ')+(CAT[x.category]||x.category);const heading=document.createElement('h2');heading.textContent=x.query;const meta=document.createElement('p');meta.className='small';meta.textContent=TEXT.traffic+': '+(x.approxTraffic||'—')+' · '+TEXT.review;const assessment=classify(x);const rating=document.createElement('p');rating.className='small';rating.textContent=LABELS[4]+': '+assessment.score+'/100 · '+(assessment.rank==='high'?LABELS[1]:assessment.rank==='medium'?LABELS[2]:LABELS[3])+' · '+LABELS[5];const hint=document.createElement('p');hint.className='small';hint.textContent=TEXT.suggest+': '+(SUG[x.category]||SUG['待人工判断']);const action=document.createElement('div');action.className='actions';for(const [label,url] of [[TEXT.verify,x.exploreUrl],[TEXT.source,x.sourceUrl]]){const href=safeUrl(url);if(href){const a=document.createElement('a');a.href=href;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';action.append(a)}}card.append(badge,heading,meta,rating,hint,action);e('items').append(card)}}for(const id of ['search','geo','potential','rank'])e(id).addEventListener('input',render);fetch('/trends.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(String(r.status));return r.json()}).then(d=>{all=Array.isArray(d.items)?d.items:[];e('status').textContent=TEXT.updated+': '+(d.updatedAt?new Date(d.updatedAt).toLocaleString('ja'):'—')+' · '+TEXT.count+': '+all.length;render()}).catch(()=>{e('items').textContent=TEXT.none});</script></body></html>
